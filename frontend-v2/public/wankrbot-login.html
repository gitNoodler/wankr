<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WankrBot — Degen Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════
           VARIABLES & RESET
           ═══════════════════════════════════════════════ */
        :root {
            --neon: #00ff41;
            --neon-dim: #00cc33;
            --neon-bright: #39ff14;
            --neon-glow: rgba(0, 255, 65, 0.5);
            --bg: #000000;
            --card-bg: rgba(6, 14, 6, 0.88);
            --input-bg: rgba(10, 25, 10, 0.75);
            --text-muted: rgba(0, 255, 65, 0.4);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Share Tech Mono', monospace;
            color: var(--neon);
            cursor: default;
            user-select: none;
        }

        /* ═══════════════════════════════════════════════
           SCENE
           ═══════════════════════════════════════════════ */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        /* ═══════════════════════════════════════════════
           ATMOSPHERE
           ═══════════════════════════════════════════════ */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,0.65) 100%);
            pointer-events: none;
            z-index: 900;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
            );
            pointer-events: none;
            z-index: 901;
        }

        /* ═══════════════════════════════════════════════
           GRID FLOOR — background.png 
           ═══════════════════════════════════════════════ */
        .grid-floor-layer {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 130%;
            height: 55vh;
            z-index: 1;
            overflow: hidden;
        }

        .grid-floor-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
            /* NO blend mode — this IS the setting */
        }

        /* Pulsing underglow beneath the grid */
        .grid-glow {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at 50% 55%,
                rgba(0, 255, 65, 0.16) 0%,
                rgba(0, 255, 65, 0.05) 30%,
                transparent 60%
            );
            animation: glowPulse 5s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        /* Ripple rings expanding across the floor */
        .floor-ripple {
            position: absolute;
            left: 50%;
            bottom: 35%;
            transform: translate(-50%, 50%);
            width: 40px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 65, 0.4);
            box-shadow: 0 0 14px rgba(0, 255, 65, 0.12);
            animation: rippleExpand 4.5s ease-out forwards;
            pointer-events: none;
            z-index: 2;
        }

        /* ═══════════════════════════════════════════════
           ROBOT MASCOT — wankrHome.png (BLACK BG REMOVED via screen blend)
           ═══════════════════════════════════════════════ */
        .robot-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 62vw;
            max-width: 780px;
            z-index: 5;
            pointer-events: none;
            animation: robotBob 5s ease-in-out infinite;
            /* screen blend removes black bg — neon/bright pixels stay visible */
            mix-blend-mode: screen;
        }

        .robot-layer img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 6px rgba(0,255,65,0.15)) drop-shadow(0 0 20px rgba(0,255,65,0.06));
        }

        /* ═══════════════════════════════════════════════
           LOGIN PANEL — Centered in robot's hand gap
           ═══════════════════════════════════════════════ */
        .login-panel-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -42%);
            z-index: 20;
            width: 310px;
            animation: panelFadeIn 0.8s ease-out 0.15s both;
        }

        .login-panel {
            padding: 28px 24px 20px;
            background: var(--card-bg);
            border: 1.5px solid rgba(0, 255, 65, 0.22);
            border-radius: 14px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow:
                0 0 30px rgba(0,255,65,0.08),
                0 0 80px rgba(0,255,65,0.04),
                inset 0 1px 0 rgba(0,255,65,0.1),
                inset 0 -1px 0 rgba(0,0,0,0.4),
                0 6px 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.4s ease, border-color 0.4s ease;
        }
        .login-panel:hover {
            box-shadow:
                0 0 40px rgba(0,255,65,0.12),
                0 0 100px rgba(0,255,65,0.06),
                inset 0 1px 0 rgba(0,255,65,0.15),
                inset 0 -1px 0 rgba(0,0,0,0.4),
                0 6px 20px rgba(0,0,0,0.5);
            border-color: rgba(0,255,65,0.32);
        }

        /* Top glow accent */
        .login-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 12%;
            width: 76%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon), transparent);
            opacity: 0.5;
        }

        .login-panel h1 {
            font-family: 'VT323', monospace;
            font-size: 34px;
            text-align: center;
            color: var(--neon);
            text-shadow: 0 0 18px rgba(0,255,65,0.3), 0 0 36px rgba(0,255,65,0.1);
            letter-spacing: 5px;
            margin-bottom: 0;
            line-height: 1;
        }

        .login-panel h2 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            text-align: center;
            color: var(--text-muted);
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 24px;
            font-weight: 400;
        }

        .input-group { margin-bottom: 13px; }

        .login-input {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid rgba(0,255,65,0.1);
            border-bottom: 2px solid rgba(0,255,65,0.25);
            border-radius: 8px;
            color: var(--neon-bright);
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            outline: none;
            transition: all 0.35s ease;
            letter-spacing: 1px;
        }
        .login-input:focus {
            border-color: var(--neon);
            box-shadow: 0 0 16px rgba(0,255,65,0.1), inset 0 0 16px rgba(0,255,65,0.03);
            background: rgba(0,16,0,0.9);
        }
        .login-input::placeholder {
            color: rgba(0,255,65,0.25);
            letter-spacing: 2px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            margin-top: 4px;
            background: var(--neon);
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: 'Audiowide', cursive;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0,255,65,0.2);
            position: relative;
            overflow: hidden;
        }
        .btn-submit:hover {
            background: var(--neon-bright);
            box-shadow: 0 0 30px rgba(0,255,65,0.3), 0 0 55px rgba(0,255,65,0.1);
            transform: translateY(-2px);
        }
        .btn-submit:active {
            transform: translateY(0);
            box-shadow: 0 0 12px rgba(0,255,65,0.2);
        }

        .btn-submit .ripple-fx {
            position: absolute;
            border-radius: 50%;
            background: rgba(0,0,0,0.3);
            transform: scale(0);
            animation: btnRipple 0.5s linear;
            pointer-events: none;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 11px;
        }

        .btn-secondary {
            flex: 1;
            padding: 10px;
            background: transparent;
            color: var(--neon);
            border: 1px solid rgba(0,255,65,0.25);
            border-radius: 8px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        .btn-secondary:hover {
            background: rgba(0,255,65,0.06);
            border-color: var(--neon);
            box-shadow: 0 0 12px rgba(0,255,65,0.1);
        }

        .quote {
            margin-top: 16px;
            text-align: center;
            font-size: 9.5px;
            color: rgba(0,255,65,0.2);
            line-height: 1.5;
            letter-spacing: 0.3px;
            font-style: italic;
        }

        /* ═══════════════════════════════════════════════
           BOOMBOX — boombox.png (BLACK BG REMOVED via screen blend)
           ═══════════════════════════════════════════════ */
        .boombox-layer {
            position: absolute;
            bottom: 6%;
            left: 5%;
            z-index: 10;
            width: 175px;
            transform: perspective(600px) rotateX(5deg) rotateY(8deg);
            /* screen blend removes black bg */
            mix-blend-mode: screen;
            animation: boomboxFadeIn 1s ease-out 0.4s both;
            cursor: pointer;
            transition: filter 0.3s ease;
        }
        .boombox-layer:hover {
            filter: brightness(1.15) drop-shadow(0 0 15px rgba(0,255,65,0.3));
        }
        .boombox-layer.playing {
            animation: boomboxFadeIn 1s ease-out 0.4s both, boomboxVibe 0.6s ease-in-out infinite 1.5s;
        }
        .boombox-layer img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 10px rgba(0,255,65,0.12));
        }

        /* Floor glow beneath boombox */
        .boombox-glow {
            position: absolute;
            bottom: -10px;
            left: 8%;
            width: 84%;
            height: 16px;
            background: radial-gradient(ellipse, rgba(0,255,65,0.2), transparent);
            filter: blur(8px);
            pointer-events: none;
        }

        /* ═══════════════════════════════════════════════
           MUSIC NOTES — notes.png (WHITE BG removed via canvas processing)
           ═══════════════════════════════════════════════ */
        .music-note {
            position: fixed;
            z-index: 11;
            pointer-events: none;
            opacity: 0;
            animation: noteFloat var(--duration) ease-out forwards;
        }
        .music-note img {
            width: var(--size);
            height: auto;
            display: block;
            filter: drop-shadow(0 0 6px rgba(0,255,65,0.25));
        }

        /* ═══════════════════════════════════════════════
           AUDIO PROMPT
           ═══════════════════════════════════════════════ */
        .audio-prompt {
            position: fixed;
            bottom: 3%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: var(--neon);
            opacity: 0.5;
            letter-spacing: 3px;
            cursor: pointer;
            z-index: 800;
            animation: promptPulse 2.2s ease-in-out infinite;
            transition: opacity 0.8s ease;
            text-shadow: 0 0 8px rgba(0,255,65,0.2);
        }
        .audio-prompt.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ═══════════════════════════════════════════════
           KEYFRAMES
           ═══════════════════════════════════════════════ */
        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.12); }
        }

        @keyframes rippleExpand {
            0% { width: 30px; height: 15px; opacity: 0.55; border-width: 2px; }
            100% { width: 1200px; height: 400px; opacity: 0; border-width: 0.5px; }
        }

        @keyframes robotBob {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-6px); }
        }

        @keyframes boomboxVibe {
            0%, 100% { transform: perspective(600px) rotateX(5deg) rotateY(8deg) rotate(0deg); }
            25% { transform: perspective(600px) rotateX(5deg) rotateY(8deg) rotate(-0.6deg); }
            75% { transform: perspective(600px) rotateX(5deg) rotateY(8deg) rotate(0.6deg); }
        }

        @keyframes noteFloat {
            0% { opacity: 0.85; transform: translateY(0) translateX(0) rotate(0deg) scale(1); }
            25% { opacity: 0.7; }
            100% { opacity: 0; transform: translateY(var(--rise)) translateX(var(--drift)) rotate(var(--spin)) scale(0.45); }
        }

        @keyframes promptPulse {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.7; }
        }

        @keyframes btnRipple {
            to { transform: scale(4); opacity: 0; }
        }

        @keyframes panelFadeIn {
            0% { opacity: 0; transform: translate(-50%, -38%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -42%) scale(1); }
        }

        @keyframes boomboxFadeIn {
            0% { opacity: 0; transform: perspective(600px) rotateX(5deg) rotateY(8deg) translateY(18px); }
            100% { opacity: 1; transform: perspective(600px) rotateX(5deg) rotateY(8deg) translateY(0); }
        }

        @keyframes formShake {
            0%, 100% { transform: translate(-50%, -42%) translateX(0); }
            15%, 45%, 75% { transform: translate(-50%, -42%) translateX(-5px); }
            30%, 60%, 90% { transform: translate(-50%, -42%) translateX(5px); }
        }
        .shake { animation: formShake 0.4s ease !important; }

        /* ═══════════════════════════════════════════════
           RESPONSIVE
           ═══════════════════════════════════════════════ */
        @media (max-width: 900px) {
            .robot-layer { width: 80vw; }
            .login-panel-wrapper { width: 280px; }
            .boombox-layer { width: 135px; left: 3%; bottom: 4%; }
        }
        @media (max-width: 600px) {
            .robot-layer { width: 95vw; }
            .login-panel-wrapper { width: 85vw; max-width: 310px; }
            .boombox-layer { width: 95px; left: 2%; bottom: 3%; }
            .login-panel h1 { font-size: 26px; letter-spacing: 3px; }
        }
    </style>
</head>
<body>
    <div class="scene">
        <!-- Atmosphere -->
        <div class="vignette"></div>
        <div class="scanlines"></div>

        <!-- ▼ GRID FLOOR — The "setting" (background.png) — NO background removal ▼ -->
        <div class="grid-floor-layer" id="gridFloor">
            <div class="grid-glow"></div>
            <img class="grid-floor-img"
                 src="./dashLayers/background.png"
                 alt="" draggable="false" />
        </div>

        <!-- ▼ ROBOT — wankrHome.png — Black BG removed via mix-blend-mode: screen ▼ -->
        <div class="robot-layer">
            <img src="./dashLayers/wankrHome.png"
                 alt="WankrBot" draggable="false" />
        </div>

        <!-- ▼ LOGIN PANEL — Between robot's hands ▼ -->
        <div class="login-panel-wrapper" id="loginPanelWrapper">
            <div class="login-panel" id="loginPanel">
                <h1>WANKR BOT</h1>
                <h2>degen login</h2>
                <div class="input-group">
                    <input type="text" class="login-input" placeholder="username" id="username" autocomplete="off" spellcheck="false">
                </div>
                <div class="input-group">
                    <input type="password" class="login-input" placeholder="password" id="password">
                </div>
                <button class="btn-submit" id="submitBtn">Submit</button>
                <div class="btn-row">
                    <button class="btn-secondary" id="newUserBtn">New User</button>
                    <button class="btn-secondary" id="spectateBtn">Spectate</button>
                </div>
                <p class="quote">"Don't miss out! Join the WankrBot circle jerk today!"<br>— Wankr</p>
            </div>
        </div>

        <!-- ▼ BOOMBOX — boombox.png — Black BG removed via mix-blend-mode: screen ▼ -->
        <div class="boombox-layer" id="boombox">
            <img src="./dashLayers/boombox.png"
                 alt="Boombox" draggable="false" />
            <div class="boombox-glow"></div>
        </div>

        <!-- Audio prompt -->
        <div class="audio-prompt" id="audioPrompt">[ CLICK ANYWHERE TO VIBE ]</div>
    </div>

    <script>
    /* ═══════════════════════════════════════════════
       NOTES IMAGE PROCESSING — Remove white background via canvas
       Processes notes.png on load, creates transparent version
       ═══════════════════════════════════════════════ */
    const NOTES_SRC = './dashLayers/notes.png';
    let processedNotesSrc = NOTES_SRC; // fallback to original

    (function processNotes() {
        const img = new Image();
        img.onload = function() {
            try {
                const c = document.createElement('canvas');
                c.width = img.naturalWidth;
                c.height = img.naturalHeight;
                const ctx = c.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(img, 0, 0);
                const data = ctx.getImageData(0, 0, c.width, c.height);
                const px = data.data;
                let removed = 0;
                for (let i = 0; i < px.length; i += 4) {
                    const r = px[i], g = px[i+1], b = px[i+2];
                    const bright = (r + g + b) / 3;
                    // Remove white and near-white pixels
                    if (bright > 235) {
                        px[i+3] = 0;
                        removed++;
                    } else if (bright > 210) {
                        // Soft fade for edge anti-aliasing
                        px[i+3] = Math.round(px[i+3] * (1 - (bright - 210) / 25));
                        removed++;
                    }
                    // Also remove very light gray backgrounds
                    else if (r > 200 && g > 200 && b > 200 && Math.abs(r - g) < 15 && Math.abs(g - b) < 15) {
                        px[i+3] = Math.round(px[i+3] * 0.15);
                        removed++;
                    }
                }
                ctx.putImageData(data, 0, 0);
                processedNotesSrc = c.toDataURL('image/png');
                console.log(`Notes processed: ${removed} pixels made transparent`);
            } catch (e) {
                console.warn('Notes canvas processing failed (likely CORS with file://), using screen blend fallback');
                // Fallback: we'll apply mix-blend-mode: screen on the note elements
                document.documentElement.style.setProperty('--notes-blend', 'screen');
            }
        };
        img.onerror = function() {
            console.warn('Notes image failed to load');
        };
        img.src = NOTES_SRC;
    })();

    /* ═══════════════════════════════════════════════
       LOFI MUSIC ENGINE — Web Audio API
       Procedural ambient pads + vinyl crackle
       ═══════════════════════════════════════════════ */
    class LofiEngine {
        constructor() {
            this.ctx = null;
            this.playing = false;
            this.timeout = null;
        }

        async init() {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();

            this.master = this.ctx.createGain();
            this.master.gain.value = 0.028;

            this.compressor = this.ctx.createDynamicsCompressor();
            this.compressor.threshold.value = -28;
            this.compressor.ratio.value = 4;

            this.filter = this.ctx.createBiquadFilter();
            this.filter.type = 'lowpass';
            this.filter.frequency.value = 800;
            this.filter.Q.value = 0.5;

            this.delay = this.ctx.createDelay();
            this.delay.delayTime.value = 0.4;
            this.delayFb = this.ctx.createGain();
            this.delayFb.gain.value = 0.14;
            this.delayWet = this.ctx.createGain();
            this.delayWet.gain.value = 0.2;

            this.filter.connect(this.compressor);
            this.compressor.connect(this.master);
            this.compressor.connect(this.delay);
            this.delay.connect(this.delayFb);
            this.delayFb.connect(this.delay);
            this.delay.connect(this.delayWet);
            this.delayWet.connect(this.master);
            this.master.connect(this.ctx.destination);

            this._crackle();
        }

        _crackle() {
            const len = this.ctx.sampleRate * 2;
            const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.008;
            const src = this.ctx.createBufferSource();
            src.buffer = buf; src.loop = true;
            const hp = this.ctx.createBiquadFilter();
            hp.type = 'highpass'; hp.frequency.value = 4500;
            const g = this.ctx.createGain(); g.gain.value = 0.045;
            src.connect(hp); hp.connect(g); g.connect(this.master);
            src.start();
        }

        _chord(notes, start, dur) {
            notes.forEach((freq, i) => {
                const osc = this.ctx.createOscillator();
                const env = this.ctx.createGain();
                osc.type = i % 2 === 0 ? 'sine' : 'triangle';
                osc.frequency.value = freq;
                const atk = 0.5 + Math.random() * 0.3;
                env.gain.setValueAtTime(0, start);
                env.gain.linearRampToValueAtTime(0.15 - i * 0.018, start + atk);
                env.gain.setValueAtTime(0.11 - i * 0.013, start + dur - 1.0);
                env.gain.linearRampToValueAtTime(0, start + dur);
                osc.connect(env); env.connect(this.filter);
                osc.start(start); osc.stop(start + dur + 0.05);
            });
        }

        _run() {
            if (!this.playing) return;
            const now = this.ctx.currentTime;
            const dur = 4.5;
            const chords = [
                [130.81, 164.81, 196.00, 246.94],
                [110.00, 130.81, 164.81, 196.00],
                [174.61, 220.00, 261.63, 329.63],
                [146.83, 174.61, 220.00, 261.63],
            ];
            chords.forEach((c, i) => this._chord(c, now + i * dur, dur));

            // Sparse high melody
            [523.25, 493.88, 440.00, 392.00].forEach((f, i) => {
                if (Math.random() > 0.4) {
                    const osc = this.ctx.createOscillator();
                    const env = this.ctx.createGain();
                    osc.type = 'sine'; osc.frequency.value = f * 0.5;
                    const s = now + i * dur + 1.2 + Math.random() * 1.2;
                    env.gain.setValueAtTime(0, s);
                    env.gain.linearRampToValueAtTime(0.045, s + 0.35);
                    env.gain.linearRampToValueAtTime(0, s + 2.0);
                    osc.connect(env); env.connect(this.filter);
                    osc.start(s); osc.stop(s + 2.3);
                }
            });

            this.timeout = setTimeout(() => this._run(), (chords.length * dur - 0.1) * 1000);
        }

        async start() {
            if (!this.ctx) await this.init();
            if (this.ctx.state === 'suspended') await this.ctx.resume();
            this.playing = true;
            this._run();
        }

        stop() {
            this.playing = false;
            clearTimeout(this.timeout);
        }
    }

    /* ═══════════════════════════════════════════════
       MUSIC NOTES — Spawn from boombox, float up & fade
       Uses processed notes.png (white bg removed)
       ═══════════════════════════════════════════════ */
    let noteInterval = null;

    function spawnNote() {
        const boom = document.getElementById('boombox');
        if (!boom) return;
        const r = boom.getBoundingClientRect();

        const el = document.createElement('div');
        el.className = 'music-note';
        // Apply screen blend fallback if canvas processing failed
        const blendFallback = getComputedStyle(document.documentElement).getPropertyValue('--notes-blend').trim();
        if (blendFallback === 'screen') {
            el.style.mixBlendMode = 'screen';
        }

        const img = document.createElement('img');
        img.src = processedNotesSrc;
        img.draggable = false;
        el.appendChild(img);

        const x = r.left + r.width * 0.12 + Math.random() * r.width * 0.76;
        const y = r.top - 8;
        const size = 30 + Math.random() * 35;
        const rise = -(110 + Math.random() * 110);
        const drift = -30 + Math.random() * 60;
        const spin = -18 + Math.random() * 36;
        const duration = 2500 + Math.random() * 1800;

        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.setProperty('--size', size + 'px');
        el.style.setProperty('--rise', rise + 'px');
        el.style.setProperty('--drift', drift + 'px');
        el.style.setProperty('--spin', spin + 'deg');
        el.style.setProperty('--duration', duration + 'ms');

        document.body.appendChild(el);
        setTimeout(() => el.remove(), duration + 100);
    }

    /* ═══════════════════════════════════════════════
       FLOOR RIPPLE SPAWNER
       ═══════════════════════════════════════════════ */
    function spawnRipple() {
        const floor = document.getElementById('gridFloor');
        if (!floor) return;
        const rip = document.createElement('div');
        rip.className = 'floor-ripple';
        const ox = (Math.random() - 0.5) * 12;
        const oy = (Math.random() - 0.5) * 8;
        rip.style.left = `calc(50% + ${ox}%)`;
        rip.style.bottom = `calc(35% + ${oy}%)`;
        floor.appendChild(rip);
        setTimeout(() => rip.remove(), 4600);
    }

    spawnRipple();
    setInterval(spawnRipple, 3400);
    setTimeout(() => setInterval(spawnRipple, 3400), 1700);

    /* ═══════════════════════════════════════════════
       AUDIO CONTROL
       ═══════════════════════════════════════════════ */
    const lofi = new LofiEngine();
    let musicOn = false;

    function startVibes() {
        if (musicOn) return;
        musicOn = true;
        document.getElementById('audioPrompt').classList.add('hidden');
        document.getElementById('boombox').classList.add('playing');
        lofi.start();
        noteInterval = setInterval(spawnNote, 1200);
        setTimeout(spawnNote, 60);
        setTimeout(spawnNote, 350);
        setTimeout(spawnNote, 750);
    }

    document.addEventListener('click', startVibes, { once: false });

    // Boombox click toggles music
    document.getElementById('boombox').addEventListener('click', (e) => {
        e.stopPropagation();
        if (!musicOn) { startVibes(); return; }
        if (lofi.playing) {
            lofi.stop();
            clearInterval(noteInterval);
            document.getElementById('boombox').classList.remove('playing');
        } else {
            lofi.playing = true;
            lofi._run();
            noteInterval = setInterval(spawnNote, 1200);
            document.getElementById('boombox').classList.add('playing');
        }
    });

    /* ═══════════════════════════════════════════════
       UI INTERACTIONS
       ═══════════════════════════════════════════════ */
    document.getElementById('submitBtn').addEventListener('click', function(e) {
        const rect = this.getBoundingClientRect();
        const rip = document.createElement('span');
        rip.className = 'ripple-fx';
        const sz = Math.max(rect.width, rect.height);
        rip.style.width = rip.style.height = sz + 'px';
        rip.style.left = (e.clientX - rect.left - sz / 2) + 'px';
        rip.style.top = (e.clientY - rect.top - sz / 2) + 'px';
        this.appendChild(rip);
        setTimeout(() => rip.remove(), 500);

        if (!document.getElementById('username').value || !document.getElementById('password').value) {
            const w = document.getElementById('loginPanelWrapper');
            w.classList.add('shake');
            setTimeout(() => w.classList.remove('shake'), 400);
        }
    });

    document.querySelectorAll('.login-input').forEach(inp => {
        inp.addEventListener('focus', () => {
            document.getElementById('loginPanel').style.borderColor = 'rgba(0,255,65,0.35)';
        });
        inp.addEventListener('blur', () => {
            document.getElementById('loginPanel').style.borderColor = 'rgba(0,255,65,0.22)';
        });
    });
    </script>
</body>
</html>
